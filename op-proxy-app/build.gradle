plugins {
    id 'java'
    id 'io.quarkus' version "${quarkusPluginVersion}"
    id 'jacoco'
    id 'org.sonarqube' version '7.3.0.8198'
}

group = 'infrastruktur.batch'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-smallrye-health'

    implementation 'io.fabric8:kubernetes-client:7.6.1'
    implementation 'io.fabric8:openshift-client:7.6.1'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
    implementation 'info.picocli:picocli:4.7.6'

    implementation 'org.slf4j:slf4j-api:2.0.13'

    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.quarkus:quarkus-junit5-mockito'
    testImplementation 'io.rest-assured:rest-assured'
    testImplementation 'io.fabric8:kubernetes-server-mock:7.3.1'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.register('runCli', JavaExec) {
    group = 'application'
    description = 'Run the batch-job CLI'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'infrastruktur.batch.cli.BatchJobCli'
    jvmArgs '-Djava.util.logging.manager=org.jboss.logmanager.LogManager'

    // CLI använder exit-koder för tillstånd, inte bara för fel.
    // Tillåt alla dokumenterade koder och faila bara på oväntade värden.
    ignoreExitValue = true
    doLast {
        def exitValue = executionResult.get().exitValue
        def acceptedExitCodes = [0, 2, 3, 4, 10, 124]
        if (!acceptedExitCodes.contains(exitValue)) {
            throw new RuntimeException("runCli failed with exit code ${exitValue}")
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = true
    }
}

sonar {
    properties {
        // SonarCloud – värden hämtas från https://sonarcloud.io efter att projektet skapats
        property 'sonar.host.url',          'https://sonarcloud.io'
        property 'sonar.organization',      'jorgen-terner'
        property 'sonar.projectKey',        'jorgen-terner_op-proxy-app'
        property 'sonar.projectName',       'op-proxy-app'
        property 'sonar.sourceEncoding',    'UTF-8'
        property 'sonar.java.source',       '21'
        property 'sonar.coverage.jacoco.xmlReportPaths',
            layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.path
        // Token läses från ~/.gradle/gradle.properties (sonar.token=...)
        // men kan också sättas här via project-property om det inte plockas upp
        if (project.hasProperty('sonar.token')) {
            property 'sonar.token', project.getProperty('sonar.token')
        }
    }
}
