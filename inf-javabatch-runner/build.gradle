plugins {
    id 'java'
}

group = 'infrastruktur.batch'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation project(':inf-batch-runner-api')
    implementation 'org.springframework.batch:spring-batch-core:5.2.1'
}

jar {
    archiveFileName = 'inf-javabatch-runner.jar'
    manifest {
        attributes('Main-Class': 'infrastruktur.batch.runner.InfJavabatchRunnerMain')
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
