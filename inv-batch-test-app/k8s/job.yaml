apiVersion: batch/v1
kind: Job
metadata:
  name: inv-batch-test-app-job
  labels:
    app: inv-batch-test-app
spec:
  suspend: true
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: inv-batch-test-app
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 45
      containers:
        - name: inv-batch-test-app-job
          image: image-registry.openshift-image-registry.svc:5000/dev252/inv-batch-test-app:latest
          imagePullPolicy: Always
          command:
            - "/bin/sh"
            - "-c"
            - "/usr/local/bin/start-both.sh"
          envFrom:
            - configMapRef:
                name: inv-batch-test-app-config
            - secretRef:
                name: inv-batch-test-app-secret
          env:
            - name: JOB_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
