apiVersion: v1
kind: ConfigMap
metadata:
  name: inv-batch-test-app-config
  labels:
    app: inv-batch-test-app
data:
  SPRING_PROFILES_ACTIVE: "xa"
  INV_DBHOST: ""
  INV_DBPORT: "50000"
  INV_DBNAME: "INV"
  OTEL_EXPORTER_OTLP_HTTP_ENDPOINT_WILDFLY: ""
  START: "http://127.0.0.1:8080/inv-batch-app/batch/myapp/start"
  STATUS: "http://127.0.0.1:8080/inv-batch-app/batch/myapp/status"
  STOP: "http://127.0.0.1:8080/inv-batch-app/batch/myapp/stop"
  EXEC_ID_PARAM_NAME: "execId"
  HTTP_TIMEOUT_SECONDS: "30"
  STATUS_POLL_INTERVAL_SECONDS: "5"
  MAX_POLL_SECONDS: "3600"
  STOP_WAIT_SECONDS: "15"
  FAIL_OPEN_ON_STATUS_ERROR: "true"
  MAX_STATUS_ERROR_RETRIES: "12"
  MAX_UNKNOWN_STATUS_RETRIES: "12"
  ACTIVE_STATUS_VALUES: "STARTING,STARTED,STOPPING"
  SUCCESS_STATUS_VALUES: "COMPLETED"
  FAILURE_STATUS_VALUES: "FAILED,ABANDONED,UNKNOWN,STOPPED"
  BATCH_RUNNER: "/produkter/fk/tools/fk-inf_batch_api/bin/batch-api-script/batch-api-runner.sh"
  RUN_BATCH_SCRIPT: "/produkter/fk/tools/fk-inf_poc_javabatch_api/scripts/run-batch.sh"
