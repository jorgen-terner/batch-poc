server.port=8080
server.servlet.context-path=/inv-batch-app
logging.config=classpath:logback-spring.xml
spring.batch.job.enabled=false
# Timeout på transaktionen, standard är 300 vilket är för lite för EU-kortet
spring.transaction.default-timeout=1800
# Swagger
springfox.documentation.enabled=false
springfox.documentation.swagger-ui.base-url=/swagger
springfox.documentation.swagger.v2.path=/swagger/v2/api-docs

management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_HTTP_ENDPOINT_WILDFLY}

spring.main.web-application-type=none

spring.datasource.url=jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.batch.jdbc.initialize-schema=always
