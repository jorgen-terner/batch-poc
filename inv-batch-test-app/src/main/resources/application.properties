server.port=8080
server.servlet.context-path=/inv-batch-app/batch
logging.config=classpath:logback-spring.xml
spring.batch.job.enabled=false
batch.runner.enabled=${BATCH_RUNNER_ENABLED:false}
# Timeout p� transaktionen, standard �r 300 vilket �r f�r lite f�r EU-kortet
spring.transaction.default-timeout=1800
spring.profiles.default=h2
springdoc.api-docs.path=/swagger/v2/api-docs
springdoc.swagger-ui.path=/swagger
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_HTTP_ENDPOINT_WILDFLY}
