spring.jta.enabled=true

spring.jta.atomikos.properties.transaction-manager-unique-name=inv-batch-test-app
spring.jta.atomikos.datasource.unique-resource-name=invPool
spring.jta.atomikos.datasource.xa-data-source-class-name=com.ibm.db2.jcc.DB2XADataSource
spring.jta.atomikos.datasource.min-pool-size=10
spring.jta.atomikos.datasource.max-pool-size=40
spring.jta.atomikos.datasource.borrow-connection-timeout=30
spring.jta.atomikos.properties.default-jta-timeout=1800000
spring.jta.atomikos.properties.max-timeout=1800000
spring.jta.atomikos.datasource.max-idle-time=300
spring.jta.atomikos.datasource.reap-timeout=300
spring.jta.atomikos.datasource.maintenance-interval=120
spring.jta.atomikos.datasource.test-query=SELECT 1 FROM SYSIBM.SYSDUMMY1
spring.jta.atomikos.datasource.xa-properties.user=${INV_BATCH2_USERNAME}
spring.jta.atomikos.datasource.xa-properties.password=${INV_BATCH2_PASSWORD}
spring.jta.atomikos.datasource.xa-properties.serverName=${INV_DBHOST}
spring.jta.atomikos.datasource.xa-properties.portNumber=${INV_DBPORT}
spring.jta.atomikos.datasource.xa-properties.databaseName=${INV_DBNAME:INV}
spring.jta.atomikos.datasource.xa-properties.driverType=4

spring.batch.jdbc.initialize-schema=never
